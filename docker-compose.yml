services:
  photovault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: photovault
    ports:
      - "5000:5000"
    environment:
      PHOTOVAULT_DATABASE_PATH: /data/database/photovault.db
      PHOTOVAULT_CONFIG_PATH: /data/config
      PHOTOVAULT_LOG_PATH: /data/logs
      PHOTOVAULT_REPORTS_PATH: /data/reports
      PHOTOVAULT_STORAGE_PATH: /storage
      PHOTOVAULT_SCAN_ROOT: /storage
      PHOTOVAULT_SCAN_EXCLUDE_PATHS: "/storage/photovault,/storage/appdata,/storage/system,/storage/domains,/storage/isos,/storage/disk_1/Backup/Louise/Louise backup/Musik,/storage/disk_1/Keys,/storage/disk_1/Musik,/storage/disk_1/Pictures/Macbook/Dagmar billeder/Pictures/Keys,/storage/disk_1/Pictures/Pictures/Keys,/storage/disk_1/ServerFolders"
      PHOTOVAULT_ALLOWED_EXTENSIONS: ".jpg,.jpeg,.png,.tif,.tiff,.heic,.heif,.cr2,.cr3,.nef,.nrw,.arw,.srf,.sr2,.orf,.rw2,.raf,.dng,.pef,.raw,.rwl,.3fr,.fff,.iiq,.kdc,.mef,.mos,.mrw,.x3f,.mp4,.mov,.m4v,.avi,.mkv,.mts,.m2ts,.3gp,.webm,.mpg,.mpeg"
      PHOTOVAULT_ORGANIZER_ROOT: /Photos
      PHOTOVAULT_DUPLICATE_ROOT: /Duplicates
      PHOTOVAULT_UNKNOWN_DATE_ROOT: /Photos/UnknownDate
      PHOTOVAULT_OUTPUT_PATH: /output
      PHOTOVAULT_LOG_LEVEL: INFO
    volumes:
      - /mnt/user/photovault:/data
      - /mnt/user:/storage:ro
      - /mnt/user/photovault-output:/output
    restart: unless-stopped
